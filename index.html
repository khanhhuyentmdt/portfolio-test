            <React.Fragment key={l}>

                className={[

          ))}

      );
    }

    /* ── Header (SPA-aware) ── */
    function Header({ lang, setLang, currentPage, navigate, activeSection }) {
      const c = HOME_CONTENT[lang];
      const [open, setOpen] = useState(false);

      const handleLogoClick = (e) => {
        e.preventDefault();
        navigate('home');
        setOpen(false);
      };

      const handleNavClick = (item, e) => {
        e.preventDefault();
        navigate('home', item.section);
        setOpen(false);
      };

      return (
        <header className="bg-white sticky top-0 z-50 border-b border-gray-200 shadow-sm">
          <div className="w-full max-w-7xl mx-auto px-4 md:px-8 py-3 md:py-4 flex items-center justify-between gap-4 md:gap-6">

                <span className="text-gray-300 font-normal">/</span>
                <span className="font-normal underline underline-offset-2 decoration-navy/50">BUSINESS ANALYST</span>
              </div>
            </a>

            <nav className="hidden md:flex items-center gap-7 flex-shrink-0">
              {c.nav.map((item) => {
                const isActive = currentPage === 'home' && activeSection === item.section;
                return (
                  <a
                    key={item.section}
                    href={currentPage === 'home' ? item.href : '#'}
                    onClick={(e) => handleNavClick(item, e)}
                    className={[
                      'font-heading text-xs font-semibold tracking-widest uppercase pb-0.5 border-b-2 transition-all duration-200 cursor-pointer',
                      isActive
                        ? 'border-navy text-navy'
                        : 'border-transparent text-gray-400 hover:text-navy hover:border-navy/30',
                    ].join(' ')}
                  >
                    {item.label}
                  </a>
                );
              })}
              <LangToggle lang={lang} setLang={setLang} />
            </nav>

            <div className="flex md:hidden items-center gap-2 flex-shrink-0">
              <LangToggle lang={lang} setLang={setLang} />
              <button
                onClick={() => setOpen(!open)}
                className="text-navy p-1"
                aria-label={open ? 'Đóng menu' : 'Mở menu'}

                {open ? <IconClose /> : <IconMenu />}

            <div className="md:hidden border-t border-gray-100 bg-white px-4 py-3 flex flex-col gap-1">

                    href={currentPage === 'home' ? item.href : '#'}

    /* ── VideoDemoBlock ── */
    function VideoDemoBlock({ url }) {
      const videoRef = useRef(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isMuted, setIsMuted] = useState(true);

      const handleTogglePlay = () => {
        if (!videoRef.current) return;
        if (videoRef.current.paused) {
          videoRef.current.play();
          setIsPlaying(true);
        } else {
          videoRef.current.pause();
          setIsPlaying(false);
        }
      };

      const handleToggleMute = (e) => {
        e.stopPropagation(); // prevent triggering play/pause
        if (!videoRef.current) return;
        videoRef.current.muted = !videoRef.current.muted;
        setIsMuted(videoRef.current.muted);
      };

      if (url) {
        return (
          <div className="flex justify-center w-full mt-8 md:mt-10">
            <div className="relative group cursor-pointer rounded-xl overflow-hidden shadow-md border border-gray-100 bg-gray-50 w-full md:w-auto" onClick={handleTogglePlay}>
              <video
                ref={videoRef}
                src={url}
                className="w-full md:max-w-full max-h-[400px] md:max-h-[600px] md:w-auto h-auto block"
                muted={isMuted}
                playsInline
                onEnded={() => setIsPlaying(false)}
              />
              {/* Play/Pause Overlay */}
              {!isPlaying && (
                <div className="absolute inset-0 bg-black/30 flex items-center justify-center transition-opacity">
                  <div className="bg-white/90 rounded-full p-4 shadow-lg text-navy">
                    <svg className="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M8 5v14l11-7z" />
                    </svg>
                  </div>
                </div>
              )}
              
              {/* Unmute/Mute Toggle Button */}
              <div className={`absolute bottom-4 right-4 transition-opacity duration-300 ${isPlaying ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}`}>
                <button
                  onClick={handleToggleMute}
                  className="bg-black/60 hover:bg-black/80 text-white rounded-full p-2.5 backdrop-blur-sm transition-colors border border-white/20 shadow-lg"
                  title={isMuted ? "Bật tiếng" : "Tắt tiếng"}
                >
                  {isMuted ? (
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.627L5.586 15z" />
                      <path strokeLinecap="round" strokeLinejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                    </svg>
                  ) : (
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.627L5.586 15z" />
                    </svg>
                  )}
                </button>
              </div>
            </div>
          </div>
        );
      }
      return (
        <div className="w-full h-80 md:h-[500px] rounded-xl bg-gray-50 border-2 border-dashed border-gray-300 flex flex-col items-center justify-center gap-3 mt-10">

            Video Demo đang được cập nhật<br />
            <span className="text-xs text-gray-300">Coming Soon</span>
          </p>
        </div>
      );

              lang === 'vi'
                ? 'Hệ thống tự động hóa toàn bộ luồng vận hành đầu tư, từ thu thập và xử lý dữ liệu thị trường, phân tích báo cáo tài chính đến quản trị dòng tiền và hỗ trợ ra quyết định giao dịch.'
                : 'The system automates the entire investment workflow, from market data gathering and processing, financial statement analysis to cash flow management and trading decision support.'
            ]
          }
        };
      }

      /* Non-overview system sections (diagrams) */
      let systemDiagramSections = systemProject
        ? systemProject.sections.filter(s => s.type !== 'overview')
        : [];
      systemDiagramSections = systemDiagramSections.filter(s => s.type !== 'placeholder');

      /* UIUX sections */
      let uiuxSections = uiuxProject ? uiuxProject.sections : [];
      if (isAiAgent) uiuxSections = uiuxSections.filter(s => s.type !== 'placeholder');

      /* Vibe Coding sections */
      const vibeProjectId = selectedProject === 'p1' ? 'vc1' : selectedProject;
      const vibeProject = VIBE_PROJECTS[lang].find(p => p.id === vibeProjectId);

      return (
        <>
          {/* PageHero — project title with lines on both sides */}
          <div className="bg-white py-8 md:py-12 px-4 md:px-8">
            <div className="w-full max-w-7xl mx-auto">
              <div className="flex items-center gap-3 md:gap-5">
                <div className="flex-1 h-px bg-gray-300" />
                <h1 className="font-heading font-black text-navy text-sm md:text-2xl tracking-normal text-center leading-snug">
                  {projectTitle}
                </h1>
                <div className="flex-1 h-px bg-gray-300" />
              </div>
            </div>
          </div>

          {/* Overview: intro + scope as 2-column grid */}
          {overviewSection && (
            <div className="bg-white px-4 md:px-8 pb-8 md:pb-10">
              <div className="w-full max-w-7xl mx-auto">
                <OverviewBlock data={overviewSection} />
              </div>
            </div>
          )}

          {/* THIẾT KẾ HỆ THỐNG banner + system sections */}
          {systemDiagramSections.length > 0 && (
            <>
              <div className="bg-navy text-white py-3 md:py-4 text-center">
                <h2 className="font-heading font-bold text-base md:text-xl tracking-normal">
                  {shared.systemDesignBanner}
                </h2>
              </div>
              <div className="bg-white px-4 md:px-8">
                <div className="w-full max-w-7xl mx-auto divide-y divide-gray-100">
                  {systemDiagramSections.map((section, i) => (
                    <SystemSectionBlock key={i} data={section} />
                  ))}
                </div>
              </div>
            </>
          )}

          {/* THIẾT KẾ UI/UX banner + uiux sections */}
          {uiuxSections.length > 0 && (
            <>
              <div className="bg-navy text-white py-3 md:py-4 text-center">
                <h2 className="font-heading font-bold text-base md:text-xl tracking-normal">
                  {shared.uiuxDesignBanner}
                </h2>
              </div>
              <div className="bg-white px-4 md:px-8">
                <div className="w-full max-w-7xl mx-auto divide-y divide-gray-100">
                  {uiuxSections.map((section, i) => (
                    <UiUxSectionBlock key={i} data={section} lang={lang} />
                  ))}
                </div>
              </div>
            </>
          )}

          {/* VIBE CODING banner + vibe sections */}
          {vibeProject && (
            <>
              <div className="bg-navy text-white py-3 md:py-4 text-center">
                <h2 className="font-heading font-bold text-base md:text-xl tracking-normal">
                  VIBE CODING
                </h2>
              </div>
              <div className="bg-white px-4 md:px-8 pb-8 md:pb-10">
                <div className="w-full max-w-7xl mx-auto">
                  {vibeProject.sections.find(s => s.type === 'overview') && (
                    <VibeOverviewBlock data={vibeProject.sections.find(s => s.type === 'overview')} lang={lang} />
                  )}
                  {('video_demo_url' in vibeProject || (vibeProject.gallery && vibeProject.gallery.length > 0)) && (
                    <div className="max-w-6xl mx-auto">
                      {'video_demo_url' in vibeProject && (
                        <VideoDemoBlock url={vibeProject.video_demo_url} />
                      )}
                      {vibeProject.gallery && vibeProject.gallery.length > 0 && (
                        <VibeGalleryBlock gallery={vibeProject.gallery} />
                      )}
                    </div>
                  )}
                  {vibeProject.sections.filter(s => s.type !== 'overview').length > 0 && (
                    <div className="divide-y divide-gray-100 mt-8">
                      {vibeProject.sections.filter(s => s.type !== 'overview').map((section, i) => (
                        <VibeCodingSectionBlock key={i} data={section} lang={lang} />
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </>
          )}

          {/* Bottom navigation */}
          <BottomNav
            lang={lang}
            prevTitle={prevProject ? prevProject.title : null}
            nextTitle={nextProject ? nextProject.title : null}
            onPrev={prevProject ? () => { window.location.hash = 'project/' + prevProject.id; } : undefined}
            onNext={nextProject ? () => { window.location.hash = 'project/' + nextProject.id; } : undefined}
            onHome={() => navigate('home', 'projects')}
          />
          <CopyrightFooter lang={lang} />
        </>
      );
    }


    /* ── BackToTop ── */
    function BackToTop() {
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const onScroll = () => setVisible(window.scrollY > 400);
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return (
        <button
          onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
          aria-label="Back to top"
          className={[
            'fixed bottom-6 right-4 md:bottom-8 md:right-8 z-50 w-10 h-10 md:w-12 md:h-12 rounded-full bg-navy text-white shadow-lg flex items-center justify-center transition-opacity duration-300',
            visible ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none',
          ].join(' ')}
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="18 15 12 9 6 15" />
          </svg>
        </button>
      );
    }

    /* ════════════════════════════════════════════════════════════
       10. APP ROOT
    ════════════════════════════════════════════════════════════ */
    function parseHash() {
      const hash = window.location.hash.replace(/^#\/?/, '');
      if (!hash || hash === 'home') return { page: 'home', project: null, section: null };
      if (['skills', 'projects', 'contact'].includes(hash)) return { page: 'home', project: null, section: hash };
      if (hash === 'cv') return { page: 'cv', project: null, section: null };
      if (hash === 'system') return { page: 'system', project: null, section: null };
      if (hash === 'uiux') return { page: 'uiux', project: null, section: null };
      if (hash === 'vibecoding') return { page: 'vibecoding', project: null, section: null };
      if (hash.startsWith('project/')) {
        const projectId = hash.split('/')[1];
        return { page: 'project_detail', project: projectId, section: null };
      }
      return { page: 'home', project: null, section: null };
    }

    function App() {
      const initialRoute = parseHash();
      const [lang, setLang] = useState('vi');
      const [currentPage, setCurrentPage] = useState(initialRoute.page);
      const [activeSection, setActiveSection] = useState('home');
      const [scrollTarget, setScrollTarget] = useState(initialRoute.section);
      const [selectedProject, setSelectedProject] = useState(initialRoute.project);

      useEffect(() => {
        const onHashChange = () => {
          const route = parseHash();
          setCurrentPage(route.page);
          setSelectedProject(route.project);
          if (route.section) {
            setScrollTarget(route.section);
          } else {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        };
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
      }, []);

      /* navigate helper — sets hash, optionally sets scroll target */
      const navigate = (page, section = null) => {
        if (section && page === 'home') {
          window.location.hash = section;
        } else {
          window.location.hash = page;
          if (section) setScrollTarget(section);
        }
      };

      /* scroll to section after navigating home */
      useEffect(() => {
        if (!scrollTarget || currentPage !== 'home') return;
        const timer = setTimeout(() => {
          const el = document.getElementById(scrollTarget);
          if (el) el.scrollIntoView({ behavior: 'smooth' });
          setScrollTarget(null);
        }, 80);
        return () => clearTimeout(timer);
      }, [scrollTarget, currentPage]);

      /* active nav section tracker (home page only) */
      useEffect(() => {
        if (currentPage !== 'home') return;
        const SECTIONS = ['home', 'skills', 'projects', 'contact'];
        const handleScroll = () => {
          if (window.scrollY + window.innerHeight >= document.body.scrollHeight - 50) {
            setActiveSection('contact');
            return;
          }
          const scrollY = window.scrollY + 96;
          let current = 'home';
          for (const id of SECTIONS) {
            const el = document.getElementById(id);
            if (el && el.offsetTop <= scrollY) current = id;
          }
          setActiveSection(current);
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, [currentPage]);

      return (
        <div>
          <Header
            lang={lang}
            setLang={setLang}
            currentPage={currentPage}
            navigate={navigate}
            activeSection={activeSection}
          />
          <main>
            {currentPage === 'home' && <HomeView lang={lang} navigate={navigate} setSelectedProject={setSelectedProject} setCurrentPage={setCurrentPage} />}
            {currentPage === 'system' && <SystemDesignView lang={lang} navigate={navigate} />}
            {currentPage === 'uiux' && <UiUxDesignView lang={lang} navigate={navigate} />}
            {currentPage === 'vibecoding' && <VibeCodingView lang={lang} navigate={navigate} />}
            {currentPage === 'project_detail' && <ProjectDetailView lang={lang} navigate={navigate} selectedProject={selectedProject} setSelectedProject={setSelectedProject} setCurrentPage={setCurrentPage} />}
            {currentPage === 'cv' && <CvView lang={lang} navigate={navigate} />}
          </main>
          <BackToTop />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>

</html>
