    function LangToggle({ lang, setLang }) {
      return (
        <div className="flex items-center border border-navy/25 rounded-full p-0.5 gap-0.5">
          {['vi', 'en'].map((l) => (
            <button
              key={l}
              onClick={() => setLang(l)}
              className={[
                'pill font-heading px-3 py-1 rounded-full text-xs font-bold tracking-widest uppercase transition-all',
                lang === l ? 'bg-navy text-white shadow-sm' : 'text-navy/40 hover:text-navy',
              ].join(' ')}
              aria-pressed={lang === l}
            >
              {l.toUpperCase()}
            </button>
          ))}
        </div>
      );
    }

    function Header({ lang, setLang, activeSection }) {
      const c = CONTENT[lang];
      const [open, setOpen] = useState(false);

      return (
        <header className="bg-white sticky top-0 z-50 border-b border-gray-200 shadow-sm">
          <div className="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between gap-6">

              <div className="font-body text-gray-400 text-[10px] font-semibold tracking-[0.25em] mt-0.5">
                BUSINESS ANALYST
              </div>
            </a>

            {/* Desktop nav */}
            <nav className="hidden md:flex items-center gap-7 flex-shrink-0">
              {c.nav.map((item) => {
                const sectionId = item.href.replace('#', '');
                const isActive  = activeSection === sectionId;
                return (
                  <a
                    key={item.href}
                    href={item.href}
                    className={[
                      'font-heading text-xs font-semibold tracking-widest uppercase pb-0.5 border-b-2 transition-all duration-200',
                      isActive
                        ? 'border-navy text-navy'
                        : 'border-transparent text-gray-400 hover:text-navy hover:border-navy/30',
                    ].join(' ')}
                  >
                    {item.label}
                  </a>
                );
              })}
              <LangToggle lang={lang} setLang={setLang} />
            </nav>

            {/* Mobile: lang + hamburger */}
            <div className="flex md:hidden items-center gap-3 flex-shrink-0">
              <LangToggle lang={lang} setLang={setLang} />
              <button
                onClick={() => setOpen(!open)}
                className="text-navy p-1"
                aria-label={open ? 'Đóng menu' : 'Mở menu'}
              >
                {open ? <IconClose /> : <IconMenu />}
              </button>
            </div>
          </div>

          {/* Mobile dropdown */}
          {open && (
            <div className="md:hidden border-t border-gray-100 bg-white px-6 py-4 flex flex-col gap-1">
              {c.nav.map((item) => {
                const sectionId = item.href.replace('#', '');
                const isActive  = activeSection === sectionId;
                return (
                  <a
                    key={item.href}
                    href={item.href}
                    onClick={() => setOpen(false)}
                    className={[
                      'font-heading text-left text-sm font-semibold tracking-wider py-2.5 border-b border-gray-100 last:border-0 transition-colors',

                    ].join(' ')}
                  >
                    {item.label}
                  </a>
                );
              })}
            </div>
          )}
        </header>
      );
    }

      const s = CONTENT[lang].skills;

      return (
        <section id="skills" className="bg-gray-50 py-20 md:py-28">
          <div className="max-w-6xl mx-auto px-6">

            <div className="mb-10">
              <h2 className="font-heading text-3xl md:text-4xl font-black text-navy tracking-tight">
                {s.heading}
              </h2>
              <div className="mt-3 h-1 w-12 rounded-full bg-lavender" />
            </div>

            <div className="flex flex-col gap-5">
              {s.cards.map((card) => (
                <div key={card.id} className="border border-gray-200 rounded-xl p-6 bg-white shadow-sm">

                  <div className="flex items-start justify-between gap-4 mb-4">
                    <h3 className="font-heading text-sm font-extrabold tracking-normal text-navy uppercase leading-relaxed">
                      {card.title}
                    </h3>
                    {card.hasButton && (
                      <button className="pill font-heading flex-shrink-0 bg-navy text-white text-[10px] font-bold tracking-[0.2em] uppercase rounded-full px-4 py-1.5 hover:opacity-90 transition-all">
                        {s.viewMore}
                      </button>
                    )}
                  </div>

                  {card.tags.length > 0 && (
                    <div className="flex flex-wrap gap-2 mb-4">
                      {card.tags.map((tag) => (
                        <span
                          key={tag}
                          className="tag font-body border border-gray-400 text-gray-600 rounded-full px-4 py-1 text-xs font-medium cursor-default select-none"
                        >
                          {tag}
                        </span>
                      ))}
                    </div>
                  )}

                  <p className="font-body text-gray-500 text-sm leading-relaxed">
                    {card.desc}
                  </p>
                </div>
              ))}
            </div>

          </div>
        </section>
      );
    }


    /* ══════════════════════════════════════════════
       7.  CONTACT FOOTER (id="contact")
           • Navy section: title + 1 card / divide-x / icon + arrow
           • Copyright bar: nền trắng, trái + phải 3 links
    ══════════════════════════════════════════════ */
    function ContactFooter({ lang }) {
      const c = CONTENT[lang].contact;

      return (
        <footer id="contact">

          {/* ─── Navy section ─── */}
          <div className="bg-navy text-white py-16 px-6">
            <div className="max-w-4xl mx-auto">

              {/* Title */}
              <h2 className="font-heading text-2xl md:text-3xl font-black tracking-normal text-center mb-10 uppercase">
                {c.heading}
              </h2>

              {/* Contact card: single container with divide-x */}
              <div className="rounded-xl border border-white/20 bg-white/10 overflow-hidden">
                <div className="grid grid-cols-1 md:grid-cols-3 divide-y divide-white/20 md:divide-y-0 md:divide-x md:divide-white/20">
                  {c.columns.map((col) => (
                    <a
                      key={col.label}
                      href={col.href}
                      target={col.href.startsWith('http') ? '_blank' : undefined}
                      rel="noopener noreferrer"
                      className="group p-6 flex flex-col gap-6 hover:bg-white/5 transition-colors duration-200 cursor-pointer"
                    >
                      {/* Top row: icon left — arrow right */}
                      <div className="flex items-start justify-between">
                        <div className="text-white/60 group-hover:text-white transition-colors duration-200">
                          <ContactColIcon type={col.type} className="w-6 h-6" />
                        </div>
                        <div className="text-white/25 group-hover:text-white/60 transition-colors duration-200">
                          <IconArrowUpRight className="w-4 h-4" />
                        </div>
                      </div>

                      {/* Bottom: label + value */}
                      <div>
                        <p className="font-heading text-[10px] font-bold tracking-normal text-white/40 uppercase mb-2">
                          {col.label}
                        </p>
                        <p className="font-body text-sm font-semibold text-white leading-relaxed break-all">
                          {col.value}
                        </p>
                      </div>
                    </a>
                  ))}
                </div>
              </div>

            </div>
          </div>

          {/* ─── Copyright bar — nền TRẮNG ─── */}
          <div className="bg-white border-t border-gray-200 py-4 px-6">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">

              {/* Trái */}
              <p className="font-body text-xs text-gray-500 font-medium tracking-wider whitespace-nowrap">
                {c.copyright}
              </p>

              {/* Phải: LinkedIn + Phone + Email */}
              <div className="flex flex-wrap items-center justify-center md:justify-end gap-x-5 gap-y-2">
                <a
                  href={c.footerLinkedIn.href}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="font-body inline-flex items-center gap-1.5 text-xs text-gray-500 hover:text-navy transition-colors"
                >
                  <IconLinkedIn className="w-3.5 h-3.5 flex-shrink-0" />
                  {c.footerLinkedIn.name}
                </a>
                <a
                  href={c.footerPhone.href}
                  className="font-body inline-flex items-center gap-1.5 text-xs text-gray-500 hover:text-navy transition-colors"
                >
                  <IconPhone className="w-3.5 h-3.5 flex-shrink-0" />
                  {c.footerPhone.value}
                </a>
                <a
                  href={c.footerEmail.href}
                  className="font-body inline-flex items-center gap-1.5 text-xs text-gray-500 hover:text-navy transition-colors"
                >
                  <IconMail className="w-3.5 h-3.5 flex-shrink-0" />
                  {c.footerEmail.value}
                </a>
              </div>

            </div>
          </div>

        </footer>
      );
    }


    /* ══════════════════════════════════════════════
       8.  APP ROOT — one-page, scroll active nav
    ══════════════════════════════════════════════ */
    function App() {
      const [lang, setLang]                   = useState('vi');
      const [activeSection, setActiveSection] = useState('home');

      useEffect(() => {
        const SECTIONS = ['home', 'skills', 'contact'];
        const handleScroll = () => {
          const scrollY = window.scrollY + 96;
          let current = 'home';
          for (const id of SECTIONS) {
            const el = document.getElementById(id);
            if (el && el.offsetTop <= scrollY) current = id;
          }
          setActiveSection(current);
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <div>
          <Header lang={lang} setLang={setLang} activeSection={activeSection} />
          <main>
            <HeroSection   lang={lang} />
            <SkillsSection lang={lang} />
            <ContactFooter lang={lang} />
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
