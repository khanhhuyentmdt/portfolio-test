                <polyline points="9 18 15 12 9 6" />

    /* ── ProjectDetailBottomNav (matrix navigation: prev/next project) ── */
    function ProjectDetailBottomNav({ navigate, lang, selectedProject, setSelectedProject, setCurrentPage }) {
      const s = SHARED_DICT[lang];
      const projects = PROJECTS[lang];
      const currentIndex = projects.findIndex(p => p.id === selectedProject);
      const isFirst = currentIndex <= 0;
      const isLast = currentIndex >= projects.length - 1;

      const goToPrev = () => {
        if (isFirst) {
          navigate('home', 'projects');
        } else {
          setSelectedProject(projects[currentIndex - 1].id);
          setCurrentPage('project_detail');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      const goToNext = () => {
        if (isLast) {
          navigate('home', 'projects');
        } else {
          setSelectedProject(projects[currentIndex + 1].id);
          setCurrentPage('project_detail');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      const prevLabel = isFirst
        ? s.backHome
        : (lang === 'vi' ? projects[currentIndex - 1].title : projects[currentIndex - 1].title);
      const nextLabel = isLast
        ? s.backHome
        : (lang === 'vi' ? projects[currentIndex + 1].title : projects[currentIndex + 1].title);

      return (
        <div className="border-t border-gray-200 py-10 px-6">
          <div className="max-w-6xl mx-auto flex justify-between items-center gap-4 flex-wrap">
            <button
              onClick={goToPrev}
              className="group inline-flex items-center gap-2 bg-navy text-white rounded-full px-6 py-2.5 font-heading text-sm font-bold tracking-wide hover:opacity-75 transition-opacity max-w-[45%]"

                <polyline points="15 18 9 12 15 6" />
              </svg>
              <span className="truncate">{isFirst ? s.backHome : (lang === 'vi' ? 'Dự án trước' : 'Previous')}</span>
            </button>
            <button
              onClick={goToNext}
              className="group inline-flex items-center gap-2 bg-navy text-white rounded-full px-6 py-2.5 font-heading text-sm font-bold tracking-wide hover:opacity-75 transition-opacity max-w-[45%]"
            >
              <span className="truncate">{isLast ? s.backHome : (lang === 'vi' ? 'Dự án tiếp theo' : 'Next project')}</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="flex-shrink-0 transition-transform duration-200 group-hover:translate-x-0.5">
                <polyline points="9 18 15 12 9 6" />

            </button>

    /* ── BackToTop ── */
    function BackToTop() {
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const onScroll = () => setVisible(window.scrollY > 400);
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return (
        <button
          onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
          aria-label="Back to top"
          className={[
            'fixed bottom-8 right-8 z-50 w-12 h-12 rounded-full bg-navy text-white shadow-lg flex items-center justify-center transition-opacity duration-300',
            visible ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none',
          ].join(' ')}
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="18 15 12 9 6 15" />
          </svg>
        </button>
      );
    }

    /* ════════════════════════════════════════════════════════════
       10. APP ROOT
    ════════════════════════════════════════════════════════════ */
    function App() {
      const [lang, setLang] = useState('vi');
      const [currentPage, setCurrentPage] = useState('home');
      const [activeSection, setActiveSection] = useState('home');
      const [scrollTarget, setScrollTarget] = useState(null);
      const [selectedProject, setSelectedProject] = useState(null);

      /* navigate helper — always scrolls to top, optionally to a section after render */
      const navigate = (page, section = null) => {
        setCurrentPage(page);
        window.scrollTo(0, 0);
        if (section) setScrollTarget(section);
      };

      /* scroll to section after navigating home */
      useEffect(() => {
        if (!scrollTarget || currentPage !== 'home') return;
        const timer = setTimeout(() => {
          const el = document.getElementById(scrollTarget);
          if (el) el.scrollIntoView({ behavior: 'smooth' });
          setScrollTarget(null);
        }, 80);
        return () => clearTimeout(timer);
      }, [scrollTarget, currentPage]);

      /* active nav section tracker (home page only) */
      useEffect(() => {
        if (currentPage !== 'home') return;
        const SECTIONS = ['home', 'skills', 'projects', 'contact'];
        const handleScroll = () => {
          if (window.scrollY + window.innerHeight >= document.body.scrollHeight - 50) {
            setActiveSection('contact');
            return;
          }
          const scrollY = window.scrollY + 96;
          let current = 'home';
          for (const id of SECTIONS) {
            const el = document.getElementById(id);
            if (el && el.offsetTop <= scrollY) current = id;
          }
          setActiveSection(current);
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, [currentPage]);

      return (
        <div>
          <Header
            lang={lang}
            setLang={setLang}
            currentPage={currentPage}
            navigate={navigate}
            activeSection={activeSection}
          />
          <main>
            {currentPage === 'home' && <HomeView lang={lang} navigate={navigate} setSelectedProject={setSelectedProject} setCurrentPage={setCurrentPage} />}
            {currentPage === 'system' && <SystemDesignView lang={lang} navigate={navigate} />}
            {currentPage === 'uiux' && <UiUxDesignView lang={lang} navigate={navigate} />}
            {currentPage === 'vibecoding' && <VibeCodingView lang={lang} navigate={navigate} />}
            {currentPage === 'project_detail' && <ProjectDetailView lang={lang} navigate={navigate} selectedProject={selectedProject} setSelectedProject={setSelectedProject} setCurrentPage={setCurrentPage} />}
            {currentPage === 'cv' && <CvView lang={lang} navigate={navigate} />}
          </main>
          <BackToTop />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>

</html>
