              <a
                href={`#${project.id}`}
                className="pill font-heading bg-navy text-white text-[10px] font-bold tracking-[0.2em] uppercase rounded-full px-4 py-1.5 hover:opacity-90 transition-all"
              >
                {c.viewMore}
              </a>
            ) : (
              <span className="font-heading bg-gray-200 text-gray-400 text-[10px] font-bold tracking-[0.2em] uppercase rounded-full px-4 py-1.5 cursor-not-allowed select-none">
                {c.viewMore}
              </span>
            )}
          </div>
        </div>
      );
    }

    function ProjectNavMenu({ projects, lang }) {
      return (
        <div className="bg-gray-50 border-b border-gray-200 py-10 px-6">
          <div className="max-w-6xl mx-auto">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
              {projects.map((project) => (
                <ProjectNavCard key={project.id} project={project} lang={lang} />
              ))}
            </div>
          </div>
        </div>
      );
    }


    /* ══════════════════════════════════════════════
       MOCKUP IMAGE — fallback, không bo góc, không caption
    ══════════════════════════════════════════════ */
    function MockupImage({ src, alt }) {
      const [missing, setMissing] = useState(false);
      return (
        <div className="flex flex-col">
          {missing ? (
            <div className="w-full aspect-[4/3] border-2 border-dashed border-gray-200 bg-gray-50 flex flex-col items-center justify-center gap-3 p-4">
              <IconImagePlaceholder />
              <p className="font-body text-sm text-gray-400 text-center break-all">{src}</p>
            </div>
          ) : (
            <img
              src={src}
              alt={alt}
              className="w-full h-auto object-contain border border-gray-200 bg-white"
              onError={() => setMissing(true)}
            />
          )}
        </div>
      );
    }


    /* ══════════════════════════════════════════════
       UX BLOCK — banner + PROTOTYPE button
    ══════════════════════════════════════════════ */
    function UXBlock({ data, lang }) {
      const { heading, bannerSrc, bannerAlt, prototypeHref } = data;
      const c = SHARED[lang];

      return (
        <div className="py-8">
          <p className="font-heading text-base font-extrabold tracking-normal text-navy uppercase mb-5">
            {heading}
          </p>
          <MockupImage src={bannerSrc} alt={bannerAlt} />
          <div className="flex justify-center mt-6">
            <a
              href={prototypeHref}
              target="_blank"
              rel="noopener noreferrer"
              className="pill font-heading font-bold tracking-widest uppercase bg-navy text-white rounded-full px-8 py-2.5 inline-flex items-center gap-2 text-sm hover:opacity-90 transition-all"
            >
              {c.prototype}
              <IconArrowUpRight />
            </a>
          </div>
        </div>
      );
    }


    /* ══════════════════════════════════════════════
       UI BLOCK — lưới ảnh màn hình
    ══════════════════════════════════════════════ */
    function UIBlock({ data }) {
      const { heading, uiLayout, images } = data;

      return (
        <div className="py-8">
          <p className="font-heading text-base font-extrabold tracking-normal text-navy uppercase mb-5">
            {heading}
          </p>

          {uiLayout === 'desktop' && (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
              {images.map((img, i) => (
                <MockupImage key={i} src={img.src} alt={img.alt} />
              ))}
            </div>
          )}

          {uiLayout === 'mobile' && (
            <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3">
              {images.map((img, i) => (
                <MockupImage key={i} src={img.src} alt={img.alt} />
              ))}
            </div>
          )}
        </div>
      );
    }


    /* ══════════════════════════════════════════════
       SECTION BLOCK DISPATCHER
    ══════════════════════════════════════════════ */
    function SectionBlock({ data, lang }) {
      if (data.type === 'ux') return <UXBlock data={data} lang={lang} />;
      if (data.type === 'ui') return <UIBlock data={data} />;
      return null;
    }


    /* ══════════════════════════════════════════════
       PROJECT HEADER — thanh navy căn giữa
    ══════════════════════════════════════════════ */
    function ProjectHeader({ project }) {
      return (
        <div className="bg-navy text-white px-6 py-6 text-center">
          <h2 className="font-heading font-black text-lg md:text-xl tracking-normal leading-snug">
            {project.fullTitle}
          </h2>
        </div>
      );
    }


    /* ══════════════════════════════════════════════
       PROJECT SECTION
    ══════════════════════════════════════════════ */
    function ProjectSection({ project, lang }) {
      if (project.sections.length === 0) return null;
      return (
        <section id={project.id} className="py-14 px-6 border-b border-gray-100">
          <div className="max-w-6xl mx-auto">
            <div className="rounded-xl overflow-hidden border border-gray-200 shadow-sm">
              <ProjectHeader project={project} />
              <div className="bg-white px-6 md:px-10 divide-y divide-gray-100">
                {project.sections.map((section, i) => (
                  <SectionBlock key={i} data={section} lang={lang} />
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }


    /* ══════════════════════════════════════════════
       COPYRIGHT FOOTER — thanh trắng đơn giản
    ══════════════════════════════════════════════ */
    function CopyrightFooter({ lang }) {
      const c = SHARED[lang];
      return (
        <footer className="bg-white border-t border-gray-200 py-4 px-6">
          <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
            <p className="font-body text-sm text-gray-500 font-medium tracking-wider whitespace-nowrap">
              {c.copyright}
            </p>
            <div className="flex flex-wrap items-center justify-center md:justify-end gap-x-5 gap-y-2">
              <a
                href={c.footerLinkedIn.href}
                target="_blank"
                rel="noopener noreferrer"
                className="font-body inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-navy transition-colors"
              >
                <IconLinkedIn className="w-4 h-4 flex-shrink-0" />
                {c.footerLinkedIn.name}
              </a>
              <a
                href={c.footerPhone.href}
                className="font-body inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-navy transition-colors"
              >
                <IconPhone className="w-4 h-4 flex-shrink-0" />
                {c.footerPhone.value}
              </a>
              <a
                href={c.footerEmail.href}
                className="font-body inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-navy transition-colors"
              >
                <IconMail className="w-4 h-4 flex-shrink-0" />
                {c.footerEmail.value}
              </a>
            </div>
          </div>
        </footer>
      );
    }


    /* ══════════════════════════════════════════════
       APP ROOT
    ══════════════════════════════════════════════ */
    function App() {
      const [lang, setLang] = useState('vi');
      const projects = PROJECTS[lang];

      return (
        <div>
          <Header lang={lang} setLang={setLang} />
          <main>
            <PageHero lang={lang} />
            <ProjectNavMenu projects={projects} lang={lang} />
            {projects.map((project) => (
              <ProjectSection key={project.id} project={project} lang={lang} />
            ))}
          </main>
          <CopyrightFooter lang={lang} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
